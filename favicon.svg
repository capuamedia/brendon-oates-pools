<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="water" x1="256" y1="104" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CC0F7"/>
      <stop offset="0.55" stop-color="#1E9EF0"/>
      <stop offset="1" stop-color="#1483E0"/>
    </linearGradient>
    <clipPath id="dropclip">
      <path d="M256,104 C256,104 384,248 384,314 a128,128 0 1,1 -256,0 C128,248 256,104 256,104 Z"/>
    </clipPath>
  </defs>

  <!-- navy tile matching the site background -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#0C1826"/>

  <!-- water droplet -->
  <path d="M256,104 C256,104 384,248 384,314 a128,128 0 1,1 -256,0 C128,248 256,104 256,104 Z"
        fill="url(#water)"/>

  <!-- inner shine / water surface highlight -->
  <g clip-path="url(#dropclip)">
    <ellipse cx="205" cy="352" rx="30" ry="46" transform="rotate(-22 205 352)"
             fill="#FFFFFF" opacity="0.35"/>
    <path d="M120,332 q68,-42 136,0 q68,42 136,0 v130 h-272 Z"
          fill="#0C1826" opacity="0.14"/>
  </g>
</svg>
